services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-relay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relay_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-relay}
      PGDATA: /data/postgres
    volumes:
      - db:/data/postgres
    ports:
      - "127.0.0.1:${DB_PORT:-5332}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-relay}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-relay}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-relay_local_dev}
      RELAY_API_KEY: ${RELAY_API_KEY:-relay-local-dev-key}
      RELAY_ALLOWED_HOSTS: ${RELAY_ALLOWED_HOSTS:-receiver,localhost,127.0.0.1}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  receiver:
    build: ./receiver
    environment:
      RELAY_API_KEY: ${RELAY_API_KEY:-relay-local-dev-key}
    ports:
      - "127.0.0.1:${RECEIVER_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  dashboard:
    build: ./frontend
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
      receiver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  db:
