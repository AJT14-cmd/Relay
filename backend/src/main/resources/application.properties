spring.application.name=Relay
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5332/relay}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:relay}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:relay_local_dev}
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.connection-timeout=5000
spring.mvc.problemdetails.enabled=true
server.shutdown=graceful
server.tomcat.connection-timeout=10s
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
relay.api-key=${RELAY_API_KEY:relay-local-dev-key}
relay.allowed-hosts=${RELAY_ALLOWED_HOSTS:localhost,127.0.0.1,receiver}
relay.worker.enabled=${RELAY_WORKER_ENABLED:true}
relay.worker.concurrency=${RELAY_WORKER_CONCURRENCY:4}
relay.worker.max-attempts=${RELAY_MAX_ATTEMPTS:5}
relay.worker.request-timeout=${RELAY_REQUEST_TIMEOUT:PT3S}
relay.worker.lease-duration=${RELAY_LEASE_DURATION:PT30S}
relay.worker.base-backoff=${RELAY_BASE_BACKOFF:PT1S}
relay.worker.max-backoff=${RELAY_MAX_BACKOFF:PT1M}
relay.worker.poll-interval=250
